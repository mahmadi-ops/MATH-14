"problemHtml": "<div class=\"para\" id=\"ex-r4o-parallelogram-3-1\">Use Green’s Theorem to evaluate the work done by <span class=\"process-math\">\\(\\mathbf{F} = \\langle x^{[%= toTeX(n) %]},\\\n[%= toTeX(A) %]x \\rangle\\)<\/span> in moving an object around the boundary of the parallelogram in <a href=\"sec-exercises-review4-online.html#fig-r4o-parallelogram\" class=\"internal\" title=\"Figure 6.2.1\">Figure 6.2.1<\/a> (<em class=\"alert\">note the orientation<\/em>), with <span class=\"process-math\">\\(x_0 = [%= toTeX(x0) %]\\)<\/span> and <span class=\"process-math\">\\(y_0 = [%= toTeX(y0) %]\\text{.}\\)<\/span> Assume that the object circulates only once around the boundary and that its motion begins at the origin and ends at the same point.<div class=\"autopermalink\" data-description=\"Paragraph\"><a href=\"#ex-r4o-parallelogram-3-1\" title=\"Copy heading and permalink for Paragraph\" aria-label=\"Copy heading and permalink for Paragraph\">🔗<\/a><\/div><\/div><div class=\"para\" id=\"ex-r4o-parallelogram-3-2\">With <span class=\"process-math\">\\(\\mathbf{F} = M\\,\\mathbf{i} + N\\,\\mathbf{j}\\text{,}\\)<\/span> first compute (a number): <span class=\"process-math\">\\(\\dfrac{\\partial N}{\\partial x}\n- \\dfrac{\\partial M}{\\partial y} =\\)<\/span> <input type=\"number\" id=\"ex-r4o-parallelogram-b1\" name=\"b1\" size=\"6\"\/><div class=\"autopermalink\" data-description=\"Paragraph\"><a href=\"#ex-r4o-parallelogram-3-2\" title=\"Copy heading and permalink for Paragraph\" aria-label=\"Copy heading and permalink for Paragraph\">🔗<\/a><\/div><\/div><div class=\"para\" id=\"ex-r4o-parallelogram-3-3\">The area of the parallelogram is <input type=\"number\" id=\"ex-r4o-parallelogram-b2\" name=\"b2\" size=\"6\"\/>.<div class=\"autopermalink\" data-description=\"Paragraph\"><a href=\"#ex-r4o-parallelogram-3-3\" title=\"Copy heading and permalink for Paragraph\" aria-label=\"Copy heading and permalink for Paragraph\">🔗<\/a><\/div><\/div><div class=\"para\" id=\"ex-r4o-parallelogram-3-4\">Work <span class=\"process-math\">\\(=\\)<\/span> <input type=\"number\" id=\"ex-r4o-parallelogram-b3\" name=\"b3\" size=\"10\"\/><div class=\"autopermalink\" data-description=\"Paragraph\"><a href=\"#ex-r4o-parallelogram-3-4\" title=\"Copy heading and permalink for Paragraph\" aria-label=\"Copy heading and permalink for Paragraph\">🔗<\/a><\/div><\/div>",

"feedbackArray": [[{"solution_code": "function() { return (ans >= curl.value({})-Math.max(0.01,1e-4*Math.abs(curl.value({})))) && (ans <= curl.value({})+Math.max(0.01,1e-4*Math.abs(curl.value({})))); }()", "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-1-1-2-1\">Correct: <span class=\"process-math\">\\(\\frac{\\partial}{\\partial x}\\left([%= toTeX(A) %]x\\right)\n- \\frac{\\partial}{\\partial y}\\left(x^{[%= toTeX(n) %]}\\right)\n= [%= toTeX(A) %] - 0\\text{.}\\)<\/span><\/div>"}, {"number": [-1000000000,1000000000], "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-1-2-2-1\">Here <span class=\"process-math\">\\(M = x^{[%= toTeX(n) %]}\\)<\/span> depends only on <span class=\"process-math\">\\(x\\text{,}\\)<\/span> so <span class=\"process-math\">\\(\\frac{\\partial M}{\\partial y} = 0\\text{,}\\)<\/span> and <span class=\"process-math\">\\(\\frac{\\partial N}{\\partial x}\n= [%= toTeX(A) %]\\text{.}\\)<\/span><\/div>"}, {"feedback": "Incorrect."}], [{"solution_code": "function() { return (ans >= area.value({})-Math.max(0.01,1e-4*Math.abs(area.value({})))) && (ans <= area.value({})+Math.max(0.01,1e-4*Math.abs(area.value({})))); }()", "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-2-1-2-1\">Correct: base <span class=\"process-math\">\\(x_0\\)<\/span> and height <span class=\"process-math\">\\(y_0\\text{,}\\)<\/span> so the area is <span class=\"process-math\">\\(x_0 y_0 = [%= toTeX(area) %]\\text{.}\\)<\/span><\/div>"}, {"number": [-1000000000,1000000000], "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-2-2-2-1\">A parallelogram’s area is base times height. The base along the <span class=\"process-math\">\\(x\\)<\/span>-axis runs from <span class=\"process-math\">\\((0,0)\\)<\/span> to <span class=\"process-math\">\\(\\left(x_0, 0\\right)\\text{,}\\)<\/span> and the height is <span class=\"process-math\">\\(y_0\\text{.}\\)<\/span><\/div>"}, {"feedback": "Incorrect."}], [{"solution_code": "function() { return (ans >= work.value({})-Math.max(0.01,1e-4*Math.abs(work.value({})))) && (ans <= work.value({})+Math.max(0.01,1e-4*Math.abs(work.value({})))); }()", "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-3-1-2-1\">Correct. Green’s Theorem gives <span class=\"process-math\">\\(\\oint \\mathbf{F}\\cdot d\\mathbf{r}\n= [%= toTeX(A) %]\\cdot\\text{Area}\\)<\/span> for the <em class=\"emphasis\">counterclockwise<\/em> orientation; since the figure’s arrows run clockwise, the work is <span class=\"process-math\">\\(-[%= toTeX(A) %]\\cdot[%= toTeX(area) %]\n= [%= toTeX(work) %]\\text{.}\\)<\/span><\/div>"}, {"solution_code": "function() { return (ans >= poswork.value({})-Math.max(0.01,1e-4*Math.abs(poswork.value({})))) && (ans <= poswork.value({})+Math.max(0.01,1e-4*Math.abs(poswork.value({})))); }()", "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-3-2-2-1\">Check the orientation: the arrows in the figure run <em class=\"emphasis\">clockwise<\/em>, and Green’s Theorem as stated applies to the counterclockwise orientation. Your answer is off by a sign.<\/div>"}, {"number": [-1000000000,1000000000], "feedback": "<div class=\"para\" id=\"ex-r4o-parallelogram-4-3-3-2-1\">By Green’s Theorem the counterclockwise circulation equals <span class=\"process-math\">\\(\\iint_R\\left(N_x - M_y\\right)dA\n= [%= toTeX(A) %]\\cdot\\text{Area}\n= [%= toTeX(A) %]\\cdot[%= toTeX(area) %]\\text{.}\\)<\/span> The figure’s orientation is clockwise, so flip the sign: Work <span class=\"process-math\">\\(= [%= toTeX(work) %]\\text{.}\\)<\/span><\/div>"}, {"feedback": "Incorrect."}]]
