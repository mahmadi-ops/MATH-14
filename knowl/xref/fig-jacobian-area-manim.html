<div class="para" id="interactive-jacobian-area-manim-1-1">Click or drag in either plane to pick a cell, or use the <span class="process-math">\(u\)</span> and <span class="process-math">\(v\)</span> sliders; the “rectangle” slider makes the grid coarser or finer, and the rectangle is always one of its cells. The card divides the area of the patch by <span class="process-math">\(\Delta u\,\Delta v\)</span> and gives <span class="process-math">\(|J|\)</span> at the corner. “Zoom to patch” follows the cell and its image in, so that both stay in view as the grid is refined; “Parallelogram” and “Grid” switch those layers off and on, “Play” runs a guided tour, and “Full screen” fills the screen with the figure.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-jacobian-area-manim-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.9.12<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The Jacobian as a local ratio of areas, animated. The lines <span class="process-math">\(u = \text{const}\)</span> and <span class="process-math">\(v = \text{const}\)</span> cut <span class="process-math">\(R\)</span> (left) into small rectangles with sides <span class="process-math">\(\Delta u\)</span> and <span class="process-math">\(\Delta v\text{,}\)</span> and <span class="process-math">\(T\)</span> carries each one to a cell of the curved grid of <span class="process-math">\(D\)</span> (right, drawn enlarged). For the highlighted cell, with corner <span class="process-math">\((u,v)\text{,}\)</span> the violet parallelogram, spanned by <span class="process-math">\(T_u\,\Delta u\)</span> and <span class="process-math">\(T_v\,\Delta v\text{,}\)</span> where <span class="process-math">\(T_u = \left\langle \partial x/\partial u,\ \partial y/\partial u \right\rangle\)</span> and <span class="process-math">\(T_v = \left\langle \partial x/\partial v,\ \partial y/\partial v \right\rangle\text{,}\)</span> approximates its image. As the grid is refined, the area of the image divided by <span class="process-math">\(\Delta u\,\Delta v\)</span> approaches <span class="process-math">\(\left|\partial(x,y)/\partial(u,v)\right| = 1/\bigl(2(x^2+y^2)\bigr)\)</span> at the corner.<div class="autopermalink" aria-hidden="true" data-description="Figure 2.9.12"><a tabindex="-1" href="#fig-jacobian-area-manim" title="Copy heading and permalink for Figure 2.9.12" aria-label="Copy heading and permalink for Figure 2.9.12">🔗</a></div></figcaption>
